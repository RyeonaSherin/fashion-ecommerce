<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>LuxeWear | Login & Signup</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <style>
    body, html {
      height: 100%;
      margin: 0;
    }

    .bg-image {
      background: linear-gradient(135deg, #5f2c82, #49a09d);
    }

    .auth-container {
      width: 100%;
      max-width: 900px;
      height: 550px;
      display: flex;
      position: relative;
      overflow: hidden;
      border-radius: 20px;
    }

    .form-panel {
      position: absolute;
      top: 0;
      width: 100%;
      max-width: 50%;
      height: 100%;
      transition: all 0.6s ease-in-out;
      overflow-y: auto;
      z-index: 1;
    }

    .login-panel {
      left: 0;
      background-color: rgba(0, 0, 0, 0.6);
      color: white;
      z-index: 2;
    }

    .signup-panel {
      right: -100%;
      background-color: white;
      color: black;
      z-index: 1;
    }

    .auth-container.active .login-panel {
      left: -100%;
    }

    .auth-container.active .signup-panel {
      right: 0;
    }
  </style>
</head>
<body>

  <div class="container-fluid vh-100 d-flex justify-content-center align-items-center bg-image">
    <div class="auth-container shadow-lg position-relative" id="authContainer">

      <!-- Login Panel -->
      <div class="form-panel login-panel p-5">
        <h3 class="mb-4 fw-bold text-center">Login</h3>
        <form onsubmit="showModal(event, 'login')">
          <div class="mb-3">
            <label class="form-label">Username</label>
            <input type="text" class="form-control form-control-lg" placeholder="Enter username">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control form-control-lg" placeholder="Enter password">
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="rememberMe">
            <label class="form-check-label" for="rememberMe">Remember me</label>
          </div>
          <button type="submit" class="btn btn-primary w-100 mb-3">Login</button>
          <p class="text-center">Don't have an account? 
            <a href="#" class="text-warning fw-semibold" onclick="showSignup()">Sign up here</a>
          </p>
        </form>
      </div>

      <!-- Sign Up Panel -->
      <div class="form-panel signup-panel p-5">
        <h3 class="mb-4 fw-bold text-center text-primary">Sign Up</h3>
        <form onsubmit="showModal(event, 'signup')">
          <div class="row">
            <div class="mb-3 col-md-6">
              <label class="form-label">First Name</label>
              <input type="text" class="form-control" placeholder="First name">
            </div>
            <div class="mb-3 col-md-6">
              <label class="form-label">Last Name</label>
              <input type="text" class="form-control" placeholder="Last name">
            </div>
          </div>
          <div class="mb-3">
            <label class="form-label">Email address</label>
            <input type="email" class="form-control" placeholder="example@email.com">
          </div>
          <div class="mb-3">
            <label class="form-label">Password</label>
            <input type="password" class="form-control" placeholder="Password">
          </div>
          <div class="mb-3">
            <label class="form-label">Confirm Password</label>
            <input type="password" class="form-control" placeholder="Re-enter password">
          </div>
          <div class="form-check mb-3">
            <input type="checkbox" class="form-check-input" id="policyCheck">
            <label class="form-check-label" for="policyCheck">
              I agree to the <a href="#">terms and policy</a>
            </label>
          </div>
          <button type="submit" class="btn btn-success w-100">Sign Up</button>
          <p class="mt-3 text-center">Already have an account? 
            <a href="#" class="text-primary fw-semibold" onclick="showLogin()">Login here</a>
          </p>
        </form>
      </div>

    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="popupModal" tabindex="-1" aria-labelledby="popupModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title" id="popupModalLabel">Success</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
        </div>
        <div class="modal-body" id="popupModalBody">
          ...
        </div>
      </div>
    </div>
  </div>

  <script>
    function showModal(e, type) {
      e.preventDefault(); // Prevent form from submitting
      const modalBody = document.getElementById("popupModalBody");
      const modalTitle = document.getElementById("popupModalLabel");

      if (type === "login") {
        modalTitle.innerText = "Login Successful";
        modalBody.innerText = "You have successfully logged in.";
      } else if (type === "signup") {
        modalTitle.innerText = "Sign Up Successful";
        modalBody.innerText = "Your account has been created.";
      }

      const popupModal = new bootstrap.Modal(document.getElementById('popupModal'));
      popupModal.show();

      if (type === "login") {
        setTimeout(() => {
          window.location.href = "../LuxeWear/Fashion-Juststyle/index.html";
        }, 1200);
      }
    }

    function showSignup() {
      document.getElementById("authContainer").classList.add("active");
    }

    function showLogin() {
      document.getElementById("authContainer").classList.remove("active");
    }
  </script>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
